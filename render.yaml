services:
  - type: web
    name: stockpilot-python-api
    runtime: docker
    plan: free
    rootDir: stockpilot-python-backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: SESSION_SECRET
        generateValue: true